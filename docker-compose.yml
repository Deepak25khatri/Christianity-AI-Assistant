services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: christianity-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6333/healthz | grep -q healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: christianity-backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      qdrant:
        condition: service_started
    environment:
      QDRANT_URL: http://qdrant:6333
      SQLITE_PATH: /data/christianity.db
      CANONICAL_BIBLE_PATH: /data/bible_canonical.json
      BM25_INDEX_PATH: /data/bm25.pkl
      CORS_ORIGINS: http://localhost,http://localhost:5173,http://127.0.0.1
    volumes:
      - sqlite_data:/data
    ports:
      - "8000:8000"

  ingest:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: christianity-ingest
    profiles: ["ingest"]
    env_file: .env
    depends_on:
      qdrant:
        condition: service_started
    environment:
      QDRANT_URL: http://qdrant:6333
      SQLITE_PATH: /data/christianity.db
      CANONICAL_BIBLE_PATH: /data/bible_canonical.json
      BM25_INDEX_PATH: /data/bm25.pkl
    volumes:
      - sqlite_data:/data
    command: ["python", "-m", "rag.ingest"]

  evals:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: christianity-evals
    profiles: ["evals"]
    env_file: .env
    depends_on:
      qdrant:
        condition: service_started
    environment:
      QDRANT_URL: http://qdrant:6333
      SQLITE_PATH: /data/christianity.db
      CANONICAL_BIBLE_PATH: /data/bible_canonical.json
      BM25_INDEX_PATH: /data/bm25.pkl
    volumes:
      - sqlite_data:/data
      - ./server/evals:/srv/evals
    command: ["python", "-m", "evals.run", "--out", "/srv/evals/last_scorecard.md"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: christianity-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  qdrant_data:
  sqlite_data:
